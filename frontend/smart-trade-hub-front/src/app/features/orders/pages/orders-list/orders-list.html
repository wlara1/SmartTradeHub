<h2>Orders</h2>

@if (orders.length > 0) {
<table border="1">
  <thead>
    <tr>
      <th>Id</th>
      <th>Status</th>
      <th>Total</th>
      <th>Date</th>
    </tr>
  </thead>
  <tbody>
    @for (order of orders; track order.id) {
    <tr key={order.id}>
      <td>{{ order.id }}</td>
      <td>{{ order.status }}</td>
      <td>{{ order.total }}</td>
      <td>{{ order.orderDate }}</td>
    </tr>
    }
  </tbody>
</table>
}

@if (orders.length === 0) {
<p>
  No orders found.
</p>
}
