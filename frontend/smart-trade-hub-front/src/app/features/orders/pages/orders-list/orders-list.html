<h2>Orders</h2>

<table border="1" *ngIf="orders.length > 0">
  <thead>
    <tr>
      <th>Id</th>
      <th>Status</th>
      <th>Total</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let order of orders">
      <td>{{ order.id }}</td>
      <td>{{ order.status }}</td>
      <td>{{ order.total }}</td>
    </tr>
  </tbody>
</table>

<p *ngIf="orders.length === 0">
  No orders found.
</p>
